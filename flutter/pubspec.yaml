name: project_bluepill
description: AI-powered personal life dashboard for mission, goals, habits, check-ins, and progress.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.0
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  google_sign_in_web: ^1.1.3
  googleapis_auth: ^2.3.0
  file_picker: ^8.1.7
  firebase_core: ^4.8.0
  expressive_loading_indicator: ^0.0.1
  m3e_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
